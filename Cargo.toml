[package]
name = "zafely"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.13" }
geojson = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
postgis = "0.9.0"
tower = "0.4"
tower-http = { version = "0.6.2", features = ["cors"] }
http = "1.3.1"